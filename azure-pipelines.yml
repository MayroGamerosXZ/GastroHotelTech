trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

steps:
- checkout: self
  displayName: 'Descargar codigo fuente'

- task: UseNode@1
  inputs:
    version: '20.x'
  displayName: 'Configurar Node.js 20'

- script: npm ci
  displayName: 'Instalar dependencias'

- script: npm run build
  displayName: 'Compilar aplicacion'

- script: npm test
  displayName: 'Ejecutar pruebas automatizadas'